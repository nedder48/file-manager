name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Add permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in MANAGE_EXTERNAL_STORAGE READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO ACCESS_WIFI_STATE REQUEST_INSTALL_PACKAGES; do
            sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\"/>\n</manifest>#" "$M"
          done
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: file-manager-plus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
